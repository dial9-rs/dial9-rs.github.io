<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
        nav { margin-bottom: 2em; }
        nav a { margin-right: 1em; color: #0366d6; text-decoration: none; }
        h1 a { color: inherit; text-decoration: none; }
        article { margin-bottom: 2em; }
        time { color: #666; font-size: 0.9em; }
        pre { background: #2b303b; color: #c0c5ce; padding: 1em; overflow-x: auto; border-radius: 4px; }
        code { font-size: 0.9em; }
    </style>
</head>
<body>
    <nav><a href="/">dial9-rs</a> <a href="/blog/">blog</a> <a href="https://github.com/dial9-rs">github</a></nav>
    {% block content %}{% endblock %}
</body>
</html>
